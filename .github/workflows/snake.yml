name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Executa diariamente à meia-noite
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Create dist directory  # Garante que o diretório exista
        run: mkdir -p dist
      - name: Generate Snake
        uses: Platane/snk@master
        with:
          github_user_name: arctisdev  # Substitua pelo seu username real
          outputs: dist/github-contribution-grid-snake.svg
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}  # Usa o segredo customizado
      - name: Check if file exists  # Debug: verifica se o arquivo foi criado
        run: |
          if [ -f dist/github-contribution-grid-snake.svg ]; then
            echo "File generated successfully"
            ls -la dist/
          else
            echo "File not found. Checking for errors..."
            echo "Possible issues: Invalid username, token permissions, or API limits."
            exit 1  # Falha o workflow para alertar
          fi
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Mantém o padrão para deploy