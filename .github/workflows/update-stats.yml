name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"  # Executa diariamente à meia-noite
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Generate GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}  # Usa o segredo customizado
          plugin_isocalendar: yes  # Adiciona um calendário de commits
          plugin_languages: yes  # Adiciona linguagens
          plugin_languages_details: bytes-size, percentage  # Detalhes das linguagens
          plugin_habits: yes  # Hábitos de commits
          plugin_habits_charts: yes
          output_action: gist  # Salva em um gist (ou use 'none' para arquivo local)
          gist: SEU_GIST_ID  # Opcional: ID de um gist público para salvar (crie um em https://gist.github.com/)
          filename: github-metrics.svg
          config_timezone: America/Sao_Paulo  # Ajuste para seu fuso horário
      - name: Deploy SVG to Repository  # Se quiser salvar no repo em vez de gist
        run: |
          mkdir -p stats
          cp github-metrics.svg stats/
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stats
          destination_dir: stats